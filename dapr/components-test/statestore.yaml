apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
    # This state store also backs Dapr Actors (RegistryActor "catalog" state, UserStoreActor "users"
    # state, etc.) — required for actors to use it at all. Same requirement as the dev component
    # (dapr/components/statestore.yaml).
    - name: actorStateStore
      value: "true"
    # keyPrefix=appid scopes every key under this app's id (streamsforge-dapr-test), same as the dev
    # component — a test-instance key never collides with a dev-instance key even before redisDB
    # isolation is considered, which is belt-and-braces given the next line.
    - name: keyPrefix
      value: appid
    # THE isolation knob plan 025 D1 needed: redisDB puts every key this component ever writes into
    # Redis logical DB 1, fully apart from DB 0 where the dev instance (streamsforge-dapr) and the
    # polyglot processors live. dapr/PARITY.md section 3 recorded this as a structural blocker — a test
    # app-id with no statestore component in its `scopes` list panics the 1.18 actor runtime outright
    # rather than degrading gracefully, so simply narrowing `scopes` to a new app-id was never enough
    # on its own; DB separation is what makes `ResetAsync`'s FLUSHDB (see DaprHostProcess) safe to run
    # without any risk of ever touching the dev instance's data, and what makes the D1 class doc's live
    # verification (`redis-cli -n 1 --scan` vs `-n 0`) meaningful in the first place.
    - name: redisDB
      value: "1"
scopes:
  - streamsforge-dapr-test
