syntax = "proto3";

package streamsforge.dynamic.v1;

option csharp_namespace = "StreamsForge.Host.Grpc.Dynamic.V1";

// ============================================================================
// DynamicStreamService — Tier 2's single generic streaming RPC for runtime
// ("dynamic") entities: stream sources, materialized tables, and pipelines.
// Unlike StreamsForge.v1.StreamService (Tier 1, one RPC per entity kind, rows
// travel as google.protobuf.Struct), this is ONE RPC for all three entity
// kinds; only the message SHAPE is dynamic — the entity's own row type is
// resolved at subscribe time via gRPC server reflection (see
// StreamsForge.Host.Grpc.Dynamic.DynamicReflectionService) against
// streamsforge.dynamic.v1.{Entity}/{Entity}Event/{Entity}Delta descriptors
// generated by StreamsForge.Host.Grpc.Dynamic.DescriptorFactory, and the
// payload bytes below are hand-encoded (StreamsForge.Host.Grpc.Dynamic.
// ProtoWireEncoder) to match that descriptor exactly, with no codegen and no
// DynamicMessage involved (C# protobuf has none).
// ============================================================================

// entity_key identifies the source/table/pipeline to subscribe to:
// "source:{name}" | "pipeline:{id}" | "table:{id}" — see
// StreamsForge.Host.Grpc.Dynamic.EntitySchemas for the exact key format, shared
// with the .proto-download endpoints and the reflection service so all three
// surfaces agree.
message EntitySubscribeRequest {
  string entity_key = 1;
}

// One frame of dynamic entity data. payload is either a wire-encoded
// {Entity}Event (sources, pipelines) or {Entity}Delta (tables) message, per
// the schema DescriptorFactory generated for entity_key's field numbers at
// subscribe time (snapshot semantics: a schema edit made to the entity after
// the subscription started is NOT tracked mid-stream — see
// DynamicStreamService's class doc). seq mirrors the payload's own internal
// seq field, exposed at the envelope level so callers can order/dedupe frames
// without decoding the payload first.
message DynamicFrame {
  string entity_key = 1;
  bytes payload = 2;
  int64 seq = 3;
}

service DynamicStreamService {
  rpc SubscribeEntity(EntitySubscribeRequest) returns (stream DynamicFrame);
}
