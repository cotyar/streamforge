[project]
name = "streamsforge-client"
version = "0.2.0"
description = "Sync-first Python client for StreamsForge live tables (gRPC + SignalR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "httpx>=0.27",
    "pandas>=2.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamsforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
