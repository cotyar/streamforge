apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
    # This state store also backs Dapr Actors (RegistryActor "catalog" state, UserStoreActor "users"
    # state) — required for actors to use it at all.
    - name: actorStateStore
      value: "true"
    # Scopes every key under this app's id (streamsforge-dapr) rather than the bare state-store/actor
    # keys Redis would otherwise use — see dapr/tools/reset.sh, which SCANs "streamsforge-dapr*" to wipe
    # only this app's data. (Dapr's redis component keyPrefix options are none|appid|name; "appid" is
    # the one that actually achieves per-app key scoping — see dapr/ARCHITECTURE.md's state-store note.)
    - name: keyPrefix
      value: appid
scopes:
  - streamsforge-dapr
# Copied from dapr/components/statestore.yaml (plan 007 W1B), retargeted at localhost:6379 — see
# pubsub.yaml's header comment for why "localhost" is correct here (shared network namespace with the
# redis container in this same compose/Cloud Run instance). keyPrefix/actorStateStore/scopes are
# unchanged from the original: this Redis is ephemeral per-instance (no volume — see README's
# ephemeral-Redis note), so per-app key scoping matters less here than on the shared local dev Redis, but
# there's no reason to diverge from the proven original settings.
