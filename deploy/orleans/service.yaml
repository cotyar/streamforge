# StreamsForge — Orleans flavor — Cloud Run v1 (Knative) Service manifest.
#
# Templated with ${IMAGE} (and optionally ${GEMINI_API_KEY}) — deploy.sh envsubst's this before
# `gcloud run services replace`. Single-container, single-silo localhost clustering (decision D-A):
# max-instances is pinned to 1 because Orleans' localhost clustering only makes sense with exactly
# one replica — do not raise it without first replacing clustering with a real membership provider.
#
# NOT applied by this wave — deploy.sh only prepares/prints commands (plan 007 non-goal: actual
# deploy is the user's call). Values (region, memory, concurrency) are reasonable starting points;
# revisit once real traffic/latency data exists.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: streamsforge-orleans
  labels:
    app: streamsforge
    flavor: orleans
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Scale-to-zero when idle; never more than one replica (see comment above — single-silo
        # localhost clustering does not support horizontal scale-out).
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # Instance-based billing (CPU allocated for the whole instance lifetime, not just during
        # requests): StreamsForge does background work between requests — generators, pipelines,
        # table actors — and request-based CPU throttling would freeze the streams mid-demo.
        # Scale-to-zero above still applies, so you only pay while an instance is awake.
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            # PORT is NOT listed: Cloud Run reserves it (deploy is rejected if set explicitly);
            # the platform injects PORT=8080 to match containerPort above.
            # Cloud Run terminates TLS itself at its edge and forwards to this container as cleartext
            # HTTP — the container never needs its own certificate here. Set
            # ASPNETCORE_FORWARDEDHEADERS_ENABLED=true (see orleans/docs/index.html § TLS) so
            # GET /api/meta/instance reports https:// endpoints instead of http://.
            - name: GEMINI_API_KEY
              value: ${GEMINI_API_KEY}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            # Cloud Run validation requires timeoutSeconds < periodSeconds (rejected live with 2/3).
            periodSeconds: 4
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
