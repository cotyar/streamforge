# StreamsForge — Orleans flavor — local compose parity for the Cloud Run image.
#
#   docker compose -f deploy/orleans/compose.yaml up -d --build
#   curl http://localhost:6199/healthz
#   docker compose -f deploy/orleans/compose.yaml down
#
# Host port 6199 (never 5199/5299 — those are the live dev server, see CLAUDE.md). This is the
# same container the admin app (plan 007 D-C) drives locally and the same image `deploy.sh`
# ships to Cloud Run (plan 007 decision D-A) — compose IS the local parity check for that image.
services:
  streamsforge-orleans:
    build:
      context: ../..
      dockerfile: deploy/orleans/Dockerfile
      # grpc.tools' bundled protoc segfaults (SIGSEGV, exit 139) under native linux/arm64 (seen on
      # Apple Silicon Docker Desktop) — pin amd64, which also matches Cloud Run's default
      # architecture and builds fine there (via emulation locally, natively on Cloud Build/Run).
      platforms:
        - linux/amd64
    image: streamsforge-orleans:local
    platform: linux/amd64
    ports:
      - "6199:8080"
    environment:
      PORT: "8080"
      # Local demo front ends that subscribe directly over REST + SignalR.
      # Keep localhost:5173 for the built-in SPA as well.
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "https://otc-terms.ac-co.localhost:1355"
      Cors__AllowedOrigins__2: "https://otc-addin.ac-co.localhost:1355"
      Cors__AllowedOrigins__3: "https://aqua-demo.ac-co.localhost:1355"
      Cors__AllowedOrigins__4: "https://aqua-addin.ac-co.localhost:1355"
      # AI control chat (plan 007 D-D) reads GEMINI_API_KEY (or Gemini__ApiKey); passed through
      # only if set on the host — unset means the chat endpoint 503s with a friendly message,
      # which is expected out of the box.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # --- TLS (optional, off by default) ------------------------------------------------------
      # This image runs the single-port `--urls` branch (see the Dockerfile's ENTRYPOINT), where the
      # *scheme* in --urls is what switches Kestrel to TLS — Tls__Enabled below has no effect on this
      # branch by itself; turning TLS on for real also means changing the Dockerfile's ENTRYPOINT (or
      # this service's `command:`) to `--urls https://0.0.0.0:${PORT}`. Left set here anyway so the
      # certificate section is in one place once that scheme change is made. See TRANSPORTS.md's
      # "Outbound TLS trust" section and orleans/docs/index.html § TLS for the full picture.
      # Tls__Enabled: "true"
      # Kestrel__Certificates__Default__Path: /certs/cert.pem
      # Kestrel__Certificates__Default__KeyPath: /certs/key.pem
    # volumes:
    #   - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: "no"
